name: Release Windows portable app

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify web app
        run: npm test

      - name: Verify source
        run: npm run lint

      - name: Build Windows portable app
        run: npm run release:win

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset = Get-ChildItem -Path "release\ArumaEditor-*-win-x64.exe" | Select-Object -First 1
          if (-not $asset) { throw "Windows Release artifact was not generated." }
          $version = node -p "require('./package.json').version"
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$version" }
          gh release create "$tag" "$($asset.FullName)" --target "$env:GITHUB_SHA" --generate-notes --title "Aruma Editor $tag"

      - name: Clean exact temporary release branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $branches = @(
            "agent/tag-picker-visual-editing",
            "agent/release-0.4.1",
            "release/v0.4.1",
            "agent/release-$version",
            "release/v$version"
          ) | Select-Object -Unique

          foreach ($branch in $branches) {
            gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/$branch" --silent 2>$null
            if ($LASTEXITCODE -eq 0) {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$branch" --silent
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete temporary branch: $branch" }
              Write-Host "Deleted temporary branch: $branch"
            } else {
              Write-Host "Temporary branch already absent: $branch"
            }
          }
