name: Release Windows portable app

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify web app
        run: npm test

      - name: Verify source
        run: npm run lint

      - name: Build Windows portable app
        run: npm run release:win

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset = Get-ChildItem -Path "release\ArumaEditor-*-win-x64.exe" | Select-Object -First 1
          if (-not $asset) { throw "Windows Release artifact was not generated." }
          $version = node -p "require('./package.json').version"
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$version" }
          gh release create "$tag" "$($asset.FullName)" --target "$env:GITHUB_SHA" --generate-notes --title "Aruma Editor $tag"
